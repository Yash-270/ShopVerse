name: Deploy Backend

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: docker build -t yash7827/shopverse-backend:latest ./backend

      - name: Push Image
        run: docker push yash7827/shopverse-backend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo docker pull yash7827/shopverse-backend:latest

            sudo docker stop shopverse || true
            sudo docker rm shopverse || true

            sudo docker run -d \
              -p 5000:5000 \
              --name shopverse \
              yash7827/shopverse-backend:latest