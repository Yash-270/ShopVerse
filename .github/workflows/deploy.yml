name: Deploy Backend

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: docker build -t yash7827/shopverse-backend:latest ./backend

      - name: Push Image
        run: docker push yash7827/shopverse-backend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo docker pull yash7827/shopverse-backend:latest

            sudo docker stop shopverse || true
            sudo docker rm shopverse || true

            sudo docker run -d \
              -p 5000:5000 \
              --name shopverse \
              -e MONGODB_URL="${{ secrets.MONGODB_URL }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e EMAIL_PASS="${{ secrets.EMAIL_PASS }}" \
              -e MAIL_FROM="${{ secrets.MAIL_FROM }}" \
              -e PORT="${{ secrets.PORT }}" \
              -e RAZORPAY_KEY="${{ secrets.RAZORPAY_KEY }}" \
              -e RAZORPAY_SECRET="${{ secrets.RAZORPAY_SECRET }}" \
              -e TWILIO_ACCOUNT_SID="${{ secrets.TWILIO_ACCOUNT_SID }}" \
              -e TWILIO_AUTH_TOKEN="${{ secrets.TWILIO_AUTH_TOKEN }}" \
              -e TWILIO_PHONE="${{ secrets.TWILIO_PHONE }}" \
              yash7827/shopverse-backend:latest